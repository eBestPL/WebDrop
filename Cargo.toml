[package]
name = "image-optimizer"
version = "0.9.2"
edition = "2024"
rust-version = "1.95"
description = "A small, local desktop image optimizer and batch WebP, AVIF and JPEG XL converter"
license = "GPL-3.0-or-later"
authors = ["Jędrzej Czarnecki <info@ebest.pl>"]
default-run = "image-optimizer"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
imagequant = "4.4"
lcms2 = { version = "6.2", features = ["static"] }
libwebp-sys = "0.14.4"
mozjpeg = { version = "0.10", default-features = false }
oxipng = { version = "10.2", default-features = false, features = ["parallel", "zopfli"] }
png = "0.18"
rfd = "0.17"
tempfile = "3.23"
roxmltree = "0.21"
usvg = { version = "0.49", default-features = false }
svgtypes = "0.16"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-sys = { version = "0.31", features = ["dlopen"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
resvg = { version = "0.49", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
